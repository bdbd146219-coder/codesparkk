<!doctype html>
<html lang="en" dir="ltr" data-theme="explorer">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b21b6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Cairo:wght@400;500;600;700&display=swap"
    />
    <title>Code Spark Kids</title>
    <script>
      // No-flash theme bootstrap — runs before React mounts.
      (function () {
        try {
          var v = localStorage.getItem('csk:theme');
          if (v === 'junior' || v === 'explorer' || v === 'staff') {
            document.documentElement.dataset.theme = v;
          }
        } catch (e) {
          /* localStorage disabled — fall back to the default attribute */
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
